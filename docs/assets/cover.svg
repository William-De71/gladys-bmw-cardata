<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the BMW CarData integration for Gladys Assistant (illustration,
       no BMW logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset="1" stop-color="#1c4f96"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fa3ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fa3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <g stroke="#1b3352" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>
  <ellipse cx="400" cy="270" rx="300" ry="170" fill="url(#glow)"/>
  <!-- cloud and stream -->
  <g transform="translate(400 92)" fill="#1d3a5f" stroke="#7fb8ff" stroke-width="4">
    <path d="M-70 20 a32 32 0 0 1 10 -62 a44 44 0 0 1 84 -8 a34 34 0 0 1 46 50 a20 20 0 0 1 -10 20 z"/>
  </g>
  <g fill="none" stroke="#58c98b" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13">
    <path d="M400 130 V205"/>
  </g>
  <!-- the car, side view -->
  <g transform="translate(400 300)">
    <path d="M-230 40 C-230 10 -215 -5 -185 -10 L-120 -20 C-90 -60 -55 -78 0 -80 C60 -80 100 -62 135 -22 L200 -12 C222 -8 232 8 232 30 L232 48 L-230 48 Z" fill="url(#car)" stroke="#9cc8ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-105 -22 C-80 -55 -50 -68 -5 -69 L-5 -22 Z" fill="#cfe4ff" opacity="0.85"/>
    <path d="M7 -69 C55 -68 88 -52 115 -22 L7 -22 Z" fill="#cfe4ff" opacity="0.85"/>
    <g fill="#0e1a2b" stroke="#9cc8ff" stroke-width="4">
      <circle cx="-140" cy="50" r="36"/>
      <circle cx="140" cy="50" r="36"/>
    </g>
    <g fill="#5d6b80"><circle cx="-140" cy="50" r="13"/><circle cx="140" cy="50" r="13"/></g>
    <!-- battery gauge -->
    <g transform="translate(-40 -2)">
      <rect x="0" y="0" width="80" height="30" rx="5" fill="#0e1a2b" stroke="#e8f1ff" stroke-width="3"/>
      <rect x="80" y="9" width="7" height="12" rx="2" fill="#e8f1ff"/>
      <rect x="5" y="5" width="48" height="20" rx="3" fill="#58c98b"/>
    </g>
  </g>
  <text x="400" y="430" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="bold" text-anchor="middle">BMW CarData</text>
  <text x="400" y="472" fill="#9cc8ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle">for Gladys Assistant</text>
</svg>
